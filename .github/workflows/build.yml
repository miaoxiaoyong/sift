name: build

# WBS M1 §1.1: CGO_ENABLED=0 four-way build (H7) + decode gateway schema drift
# gate (V14). This workflow proves the module and the three command binaries
# cross-build on darwin/linux × amd64/arm64, and that the generated JSON
# Schemas (internal/schema/artifacts) never drift from their struct definitions.
#
# The decode gateway (internal/schema) is pure stdlib, so every combo builds
# it under CGO_ENABLED=0. Schema generation lives in the nested tools/schema
# module, outside the root build package set; root go:generate directives invoke
# it explicitly and CI diffs its deterministic output against committed files.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-matrix:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: build (CGO_ENABLED=0)
        run: go build ./...

  schema-drift:
    # V14 schema invariant: structs are the single source of truth and the
    # generated schemas are checked in. If a struct changes without
    # regenerating its schema, this job fails. DESIGN §5.2.
    name: schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: go generate
        run: go generate ./...
      - name: detect drift
        run: |
          if ! git diff --exit-code -- internal/schema/artifacts/ internal/brain/prompts/; then
            echo "::error::Generated JSON Schema artifacts drift from struct definitions." \
              "Run 'go generate ./...' and commit the result."
            exit 1
          fi

  check:
    name: vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: install tmux (Linux runtime evidence)
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - run: CGO_ENABLED=0 go vet ./...
      - name: test (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test ./...
      # issue #35: TestV10ZeroNetworkListeners is //go:build linux gated, so
      # it only compiles and runs on this ubuntu runner. The step above already
      # gates the whole suite; this re-runs the named test verbosely and asserts
      # its PASS line is present, so the Linux success is reviewable in the log
      # instead of only a package-level "ok". No assertion is weakened: the
      # grep fails the build if the named test did not run and pass.
      - name: M5 consolidated named vectors
        run: |
          set -o pipefail
          go test -v -count=3 ./internal/storage -run 'Test(V2CurrentWritePortsCrashAtomicity|V4HumanStateInterleavings|ApplyRetryProbeResult|ApplyCommandStartupStall|AdvanceInterruptStartupStallAtLimit|V8OutboxFairnessUnderHotRun|CriticalFuse|AttentionQuotaConcurrentNoBorrowing|V11GateBypass|Metrics)' | tee m5-storage.log
          grep -q -- '--- PASS: TestV2CurrentWritePortsCrashAtomicity' m5-storage.log
          grep -q -- '--- PASS: TestV4HumanStateInterleavings' m5-storage.log
          grep -q -- '--- PASS: TestV8OutboxFairnessUnderHotRun' m5-storage.log
          grep -q -- '--- PASS: TestCriticalFuseConcurrentAdmissionSerializes' m5-storage.log
          grep -q -- '--- PASS: TestV11GateBypassExcludedFromFalseRelease' m5-storage.log
          go test -v -count=3 ./internal/brain ./internal/gate -run 'Test(EmitInterruptT4|EmitInterruptT6|T7|A7|V9FullFake)' | tee m5-brain-gate.log
          grep -q -- '--- PASS: TestT7SchedulerGlobalProjectConcreteAllAndOnce' m5-brain-gate.log
          grep -q -- '--- PASS: TestV9FullFakeGateInterruptCommandMergeChain' m5-brain-gate.log
          go test -v -count=3 ./internal/controlplane ./internal/command -run 'Test(V10a|ReportSubmit|OpsMetricsCoversNineSeries|CompileStartupStall)' | tee m5-endpoints.log
          grep -q -- '--- PASS: TestV10aEndpointCapabilitiesAndSockets' m5-endpoints.log
          grep -q -- '--- PASS: TestReportSubmitRunningAccepted' m5-endpoints.log
          grep -q -- '--- PASS: TestOpsMetricsCoversNineSeries' m5-endpoints.log
          go test -v -race -count=3 ./internal/storage ./internal/brain ./internal/gate -run 'Test(V2CurrentWritePortsCrashAtomicity|V4HumanStateInterleavings|V8OutboxFairnessUnderHotRun|CriticalFuseConcurrentAdmissionSerializes|AttentionQuotaConcurrentNoBorrowing|EmitInterruptT4|EmitInterruptT6|T7Scheduler|A7|V9FullFake)' | tee m5-race.log
          grep -q -- '--- PASS: TestV4HumanStateInterleavings' m5-race.log
          grep -q -- '--- PASS: TestV9FullFakeGateInterruptCommandMergeChain' m5-race.log
      - name: M6 real tmux runtime evidence (linux)
        run: |
          set -o pipefail
          SIFT_REQUIRE_TMUX=1 go test -v -race ./internal/runtime ./internal/config -run 'TestTmuxCredentialIsolationAndLiteralWrapperArgv|TestTmuxProbe' -count=10 | tee m6-tmux-runtime.log
          grep -q -- '--- PASS: TestTmuxCredentialIsolationAndLiteralWrapperArgv' m6-tmux-runtime.log
          grep -q -- '--- PASS: TestTmuxProbe' m6-tmux-runtime.log
          if grep -q -- '--- SKIP:' m6-tmux-runtime.log; then
            echo '::error::Real tmux runtime evidence must not skip.'
            exit 1
          fi
      - name: V10 zero-listener evidence (linux)
        run: |
          CGO_ENABLED=0 go test -v -run TestV10ZeroNetworkListeners ./internal/controlplane/ | tee v10.log
          grep -q -- "--- PASS: TestV10ZeroNetworkListeners" v10.log
